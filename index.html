<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>너는 나의 별이야 — 88건반 피아노 연습기</title>
<style>
  :root {
    --bg: #0b0f19;
    --panel: #131a2a;
    --panel-2: #1a2338;
    --border: #26324d;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --lh: #38bdf8;
    --lh-glow: rgba(56, 189, 248, 0.55);
    --rh: #34d399;
    --rh-glow: rgba(52, 211, 153, 0.55);
    --accent: #a78bfa;
    --warn: #fbbf24;
    --danger: #f87171;
  }
  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
    overflow: hidden;
  }
  .app {
    display: flex; flex-direction: column; height: 100dvh; width: 100vw;
  }
  /* Top Control Bar */
  .topbar {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
    gap: 8px; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--border);
    z-index: 20;
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
  }
  .brand-title { font-weight: 700; font-size: 15px; letter-spacing: -0.3px; }
  .brand-sub { font-size: 11px; color: var(--muted); }
  .controls {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
  }
  button, select {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 10px; font-size: 12px; font-weight: 600;
    cursor: pointer; transition: all 0.12s ease;
  }
  button:hover { border-color: #475569; background: #222d46; }
  button.primary { background: #2563eb; border-color: #3b82f6; color: #fff; }
  button.primary:hover { background: #1d4ed8; }
  button.active { background: #0f766e; border-color: #14b8a6; color: #fff; }
  button.wait-on { background: #7c3aed; border-color: #a78bfa; color: #fff; }
  .speed-group {
    display: flex; align-items: center; gap: 4px; background: var(--panel-2);
    border: 1px solid var(--border); border-radius: 8px; padding: 3px 6px;
  }
  .speed-group span { font-size: 11px; color: var(--muted); margin-right: 2px; }
  .speed-btn { padding: 3px 7px; font-size: 11px; border: none; background: transparent; border-radius: 6px; }
  .speed-btn.on { background: #2563eb; color: #fff; }

  /* Section Pills */
  .sections-bar {
    display: flex; align-items: center; gap: 6px; padding: 6px 12px;
    background: #0f1523; border-bottom: 1px solid var(--border);
    overflow-x: auto; scrollbar-width: none;
  }
  .sections-bar::-webkit-scrollbar { display: none; }
  .sec-pill {
    white-space: nowrap; padding: 4px 10px; font-size: 11px; border-radius: 999px;
    background: var(--panel-2); border: 1px solid var(--border); color: var(--muted);
  }
  .sec-pill.on { background: rgba(56, 189, 248, 0.18); border-color: var(--lh); color: #fff; }

  /* HUD / Lyrics Banner */
  .hud {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    padding: 8px 14px; background: rgba(15, 23, 42, 0.85); border-bottom: 1px solid var(--border);
    gap: 10px;
  }
  .hud-left { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .chord-now { font-size: 22px; font-weight: 800; color: var(--rh); letter-spacing: -0.5px; }
  .tip-now { font-size: 11px; color: var(--warn); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hud-center { text-align: center; min-width: 0; }
  .lyric-now { font-size: 20px; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lyric-next { font-size: 12px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hud-right { display: flex; justify-content: flex-end; align-items: center; gap: 12px; font-size: 12px; }
  .stat-box { text-align: right; }
  .stat-val { font-size: 15px; font-weight: 700; color: var(--lh); }
  .stat-lbl { font-size: 10px; color: var(--muted); }
  .midi-badge {
    font-size: 11px; padding: 3px 8px; border-radius: 999px;
    background: #1e293b; border: 1px solid #334155; color: var(--muted);
  }
  .midi-badge.ok { background: rgba(52, 211, 153, 0.15); border-color: var(--rh); color: var(--rh); }

  /* Stage: Falling Notes Canvas */
  .stage-wrap {
    position: relative; flex: 1; min-height: 180px; background: radial-gradient(circle at 50% 0%, #162038 0%, #090d16 80%);
    overflow: hidden;
  }
  canvas#fallCanvas { display: block; width: 100%; height: 100%; }
  .wait-banner {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    background: rgba(124, 58, 237, 0.9); color: #fff; padding: 5px 14px;
    border-radius: 999px; font-size: 12px; font-weight: 700;
    box-shadow: 0 4px 16px rgba(124, 58, 237, 0.4); display: none;
    pointer-events: none;
  }
  .judge-pop {
    position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
    font-size: 20px; font-weight: 800; pointer-events: none; opacity: 0;
    transition: opacity 0.25s ease;
    text-shadow: 0 2px 10px rgba(0,0,0,0.8);
  }

  /* 88-Key Piano Container */
  .piano-wrap {
    position: relative; height: 155px; background: #05070c;
    border-top: 3px solid #334155; overflow-x: auto; overflow-y: hidden;
    scrollbar-width: thin;
  }
  .piano-inner {
    position: relative; height: 100%; margin: 0 auto;
  }
  .key-w {
    position: absolute; top: 0; height: 100%;
    background: linear-gradient(180deg, #f8fafc 0%, #e2e8f0 88%, #cbd5e1 100%);
    border: 1px solid #475569; border-top: none; border-radius: 0 0 4px 4px;
    display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
    padding-bottom: 5px; cursor: pointer; z-index: 1;
  }
  .key-w.c4 { background: linear-gradient(180deg, #fffbeb 0%, #fef3c7 88%, #fde68a 100%); }
  .key-b {
    position: absolute; top: 0; height: 62%;
    background: linear-gradient(180deg, #1e293b 0%, #0f172a 80%, #020617 100%);
    border: 1px solid #334155; border-top: none; border-radius: 0 0 3px 3px;
    display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
    padding-bottom: 4px; cursor: pointer; z-index: 2;
  }
  .key-lbl {
    font-size: 9px; font-weight: 700; color: #475569; line-height: 1; pointer-events: none;
  }
  .key-b .key-lbl { color: #94a3b8; font-size: 8px; }
  /* Active / Target highlights */
  .key-w.target-lh { background: linear-gradient(180deg, #bae6fd 0%, #38bdf8 90%); border-color: #0284c7; }
  .key-b.target-lh { background: linear-gradient(180deg, #0284c7 0%, #0369a1 100%); border-color: #7dd3fc; }
  .key-w.target-rh { background: linear-gradient(180deg, #a7f3d0 0%, #34d399 90%); border-color: #059669; }
  .key-b.target-rh { background: linear-gradient(180deg, #059669 0%, #047857 100%); border-color: #6ee7b7; }
  .key-w.pressed, .key-b.pressed {
    box-shadow: inset 0 0 12px rgba(251, 191, 36, 0.95);
    outline: 2px solid #fbbf24;
  }

  /* Progress Bar */
  .progress-row {
    display: flex; align-items: center; gap: 8px; padding: 4px 12px;
    background: var(--panel); border-top: 1px solid var(--border); font-size: 11px; color: var(--muted);
  }
  input[type="range"].seek { flex: 1; accent-color: #38bdf8; cursor: pointer; }

  @media (max-width: 720px) {
    .hud { grid-template-columns: 1fr; text-align: left; padding: 6px 10px; gap: 4px; }
    .hud-center { text-align: left; }
    .hud-right { justify-content: space-between; }
    .chord-now { font-size: 18px; }
    .lyric-now { font-size: 16px; }
    .piano-wrap { height: 135px; }
  }
</style>
</head>

<div class="app">
  <!-- Top Bar -->
  <div class="topbar">
    <div class="brand">
      <div>
        <div class="brand-title">🎹 너는 나의 별이야 <span style="font-size:11px;color:#38bdf8;font-weight:500;">E♭ Major · ♩=70</span></div>
        <div class="brand-sub">파랑: 왼손 베이스 · 초록: 오른손 코드 · 88건반 (A0~C8)</div>
      </div>
    </div>

    <div class="controls">
      <button id="btnPlay" class="primary">▶ 재생</button>
      <button id="btnReset">⏮ 처음</button>
      <button id="btnWait" title="맞는 건반을 누를 때까지 기다립니다">⏸ 기다림 모드: OFF</button>
      <button id="btnLoop">🔁 구간반복: OFF</button>

      <div class="speed-group">

        <button class="speed-btn" data-spd="0.5">0.5x</button>

        <button class="speed-btn on" data-spd="1">1.0x</button>
        <button class="speed-btn" data-spd="1.25">1.25x</button>
      </div>

      <button id="btnZoom">🔍 연주구간 확대</button>
      <button id="btnLabels" class="active">한글 계이름</button>
      <button id="btnHands" class="active">🖐️ 모의 손모양</button>
      <button id="btnMetro">🥁 메트로놈</button>
      <button id="btnSound" class="active">🔊 피아노음</button>
    </div>
  </div>

  <!-- Section Quick Jump -->
  <div class="sections-bar" id="sectionsBar"></div>

  <!-- HUD -->
  <div class="hud">
    <div class="hud-left">

    </div>
    <div class="hud-center">
      <div class="lyric-now" id="lyricNow">어느 날 내게 다가온 너-</div>
      <div class="lyric-next" id="lyricNext">다음: 무엇보다-</div>
    </div>
    <div class="hud-right">
      <span class="midi-badge" id="midiStatus">MIDI 미연결 (터치/마우스 가능)</span>
      <div class="stat-box">
        <div class="stat-val" id="measureNow">1 / 63 마디</div>
        <div class="stat-lbl" id="scoreNow">정확도 —</div>
      </div>
    </div>
  </div>

  <!-- Falling Notes Stage -->
  <div class="stage-wrap" id="stageWrap">
    <canvas id="fallCanvas"></canvas>
    <div class="wait-banner" id="waitBanner">⏸ 건반을 눌러 다음으로 넘어가세요</div>
    <div class="judge-pop" id="judgePop">PERFECT!</div>
  </div>

  <!-- Seek Bar -->
  <div class="progress-row">
    <span id="timeText">0:00 / 0:00</span>
    <input type="range" class="seek" id="seekBar" min="0" max="1000" value="0" />
    <span id="bpmText">70 BPM</span>
  </div>

  <!-- 88-Key Piano -->
  <div class="piano-wrap" id="pianoWrap">
    <div class="piano-inner" id="pianoInner"></div>
  </div>
</div>

SONG_EVENTS.forEach((ev, idx) => {
  const startBeat = beatCursor;
  const endBeat = beatCursor + ev.b;
  const item = { ...ev, idx, startBeat, endBeat };
  TIMELINE.push(item);
  if (!SECTION_RANGES[ev.sec]) {
    SECTION_RANGES[ev.sec] = { name: ev.sec, startBeat, endBeat, firstIdx: idx };
  } else {
    SECTION_RANGES[ev.sec].endBeat = endBeat;
  }
  beatCursor = endBeat;
});
const TOTAL_BEATS = beatCursor + 2;

// Solfege & Note names (Eb Major friendly: flat names)
const SOLFEGE_KO = ['도', '레♭', '레', '미♭', '미', '파', '파#', '솔', '라♭', '라', '시♭', '시'];
const NOTE_EN = ['C', 'D♭', 'D', 'E♭', 'E', 'F', 'F#', 'G', 'A♭', 'A', 'B♭', 'B'];
function isBlack(midi) {
  return [1, 3, 6, 8, 10].includes(midi % 12);
}
function midiLabel(midi, korean = true) {
  const pc = midi % 12;
  const oct = Math.floor(midi / 12) - 1;
  return korean ? SOLFEGE_KO[pc] : (NOTE_EN[pc] + (pc === 0 ? oct : ''));
}

// Audio Engine (Warm Piano Web Audio API)
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function playPianoNote(midi, durSec = 0.9, vol = 0.22) {
  if (!soundOn) return;
  ensureAudio();
  const freq = 440 * Math.pow(2, (midi - 69) / 12);
  const now = audioCtx.currentTime;
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.001, now);
  gain.gain.exponentialRampToValueAtTime(vol, now + 0.012);
  gain.gain.exponentialRampToValueAtTime(vol * 0.45, now + 0.18);
  gain.gain.exponentialRampToValueAtTime(0.0008, now + durSec);

  const osc1 = audioCtx.createOscillator();
  osc1.type = 'triangle';
  osc1.frequency.setValueAtTime(freq, now);

  const osc2 = audioCtx.createOscillator();
  osc2.type = 'sine';
  osc2.frequency.setValueAtTime(freq * 2, now);
  const g2 = audioCtx.createGain();
  g2.gain.value = 0.18;

  osc1.connect(gain);
  osc2.connect(g2);
  g2.connect(gain);
  gain.connect(audioCtx.destination);

  osc1.start(now); osc2.start(now);
  osc1.stop(now + durSec + 0.05); osc2.stop(now + durSec + 0.05);
}
function playClick(accent = false) {
  if (!metroOn) return;
  ensureAudio();
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.frequency.value = accent ? 1100 : 750;
  g.gain.setValueAtTime(0.14, now);
  g.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
  osc.connect(g); g.connect(audioCtx.destination);
  osc.start(now); osc.stop(now + 0.06);
}

// Build 88-Key Piano DOM & Geometry
const pianoWrap = document.getElementById('pianoWrap');
const pianoInner = document.getElementById('pianoInner');
const keyElements = {};
let keyLayout = {}; // midi -> { x, w, black }

function buildKeyboard() {
  pianoInner.innerHTML = '';
  keyLayout = {};
  const minMidi = zoomRange ? 36 : 21; // C2..C6 vs A0..C8
  const maxMidi = zoomRange ? 84 : 108;

  let whiteCount = 0;
  for (let m = minMidi; m <= maxMidi; m++) if (!isBlack(m)) whiteCount++;

  const containerW = Math.max(pianoWrap.clientWidth, zoomRange ? whiteCount * 28 : whiteCount * 22);
  const wWidth = containerW / whiteCount;
  const bWidth = wWidth * 0.62;
  pianoInner.style.width = containerW + 'px';

  let wIdx = 0;
  for (let m = minMidi; m <= maxMidi; m++) {
    if (!isBlack(m)) {
      const x = wIdx * wWidth;
      const el = document.createElement('div');
      el.className = 'key-w' + (m === 60 ? ' c4' : '');
      el.style.left = x + 'px';
      el.style.width = wWidth + 'px';
      const lbl = document.createElement('span');
      lbl.className = 'key-lbl';
      lbl.textContent = m === 60 ? (showKorean ? '도4' : 'C4') : midiLabel(m, showKorean);
      el.appendChild(lbl);
      bindKeyInput(el, m);
      pianoInner.appendChild(el);
      keyElements[m] = el;
      keyLayout[m] = { x, w: wWidth, black: false };
      wIdx++;
    }
  }
  for (let m = minMidi; m <= maxMidi; m++) {
    if (isBlack(m)) {
      const prev = keyLayout[m - 1];
      if (!prev) continue;
      const x = prev.x + prev.w - bWidth / 2;
      const el = document.createElement('div');
      el.className = 'key-b';
      el.style.left = x + 'px';
      el.style.width = bWidth + 'px';
      const lbl = document.createElement('span');
      lbl.className = 'key-lbl';
      lbl.textContent = midiLabel(m, showKorean);
      el.appendChild(lbl);
      bindKeyInput(el, m);
      pianoInner.appendChild(el);
      keyElements[m] = el;
      keyLayout[m] = { x, w: bWidth, black: true };
    }
  }
  // Center around C4 if scrollable
  if (keyLayout[60]) {
    pianoWrap.scrollLeft = Math.max(0, keyLayout[60].x - pianoWrap.clientWidth / 2);
  }
}

function bindKeyInput(el, midi) {
  const down = (e) => {
    e.preventDefault();
    handleUserNoteOn(midi);
  };
  const up = (e) => {
    e.preventDefault();
    handleUserNoteOff(midi);
  };
  el.addEventListener('mousedown', down);
  el.addEventListener('mouseup', up);
  el.addEventListener('mouseleave', up);
  el.addEventListener('touchstart', down, { passive: false });
  el.addEventListener('touchend', up, { passive: false });
}

function handleUserNoteOn(midi) {
  pressedKeys.add(midi);
  if (keyElements[midi]) keyElements[midi].classList.add('pressed');
  playPianoNote(midi, 0.85, 0.25);

  // Check hit against current active event
  const cur = getCurrentEvent();
  if (cur) {
    const targets = [...cur.lh, ...cur.rh];
    if (targets.includes(midi)) {
      hits++;
      totalTargets++;
      showJudge('GOOD!', '#34d399');
      // If wait mode is active, check if all target keys (or >=2) are pressed
      if (waitMode && waitedIdx === cur.idx) {
        const allPressed = targets.every(t => pressedKeys.has(t));
        if (allPressed) {
          waitedIdx = -1;
          document.getElementById('waitBanner').style.display = 'none';
          currentBeat = cur.startBeat + 0.08;
          isPlaying = true;
          updatePlayBtn();
        }
      }
    }
    updateStats();
  }
}

function handleUserNoteOff(midi) {
  pressedKeys.delete(midi);
  if (keyElements[midi]) keyElements[midi].classList.remove('pressed');
}

function showJudge(txt, color) {
  const pop = document.getElementById('judgePop');
  pop.textContent = txt;
  pop.style.color = color;
  pop.style.opacity = '1';
  clearTimeout(pop._t);
  pop._t = setTimeout(() => { pop.style.opacity = '0'; }, 450);
}

// Web MIDI API
if (navigator.requestMIDIAccess) {
  navigator.requestMIDIAccess().then((midiAccess) => {
    const updateMidi = () => {
      const inputs = Array.from(midiAccess.inputs.values());
      const badge = document.getElementById('midiStatus');
      if (inputs.length > 0) {
        badge.textContent = `🎹 MIDI 연결됨 (${inputs[0].name || '피아노'})`;
        badge.classList.add('ok');
        inputs.forEach(inp => {
          inp.onmidimessage = (msg) => {
            const [cmd, note, vel] = msg.data;
            const type = cmd & 0xf0;
            if (type === 0x90 && vel > 0) handleUserNoteOn(note);
            else if (type === 0x80 || (type === 0x90 && vel === 0)) handleUserNoteOff(note);
          };
        });
      } else {
        badge.textContent = 'MIDI 미연결 (터치/마우스 가능)';
        badge.classList.remove('ok');
      }
    };
    updateMidi();
    midiAccess.onstatechange = updateMidi;
  }).catch(() => {});
}

// Sections Bar
const sectionsBar = document.getElementById('sectionsBar');
Object.values(SECTION_RANGES).forEach(sec => {
  const btn = document.createElement('button');
  btn.className = 'sec-pill' + (sec.name === activeSection ? ' on' : '');
  btn.textContent = sec.name;
  btn.onclick = () => {
    activeSection = sec.name;
    currentBeat = sec.startBeat;
    playedEvents.clear();
    waitedIdx = -1;
    document.querySelectorAll('.sec-pill').forEach(p => p.classList.toggle('on', p.textContent === sec.name));
    updateHUD();
  };
  sectionsBar.appendChild(btn);
});

function getCurrentEvent() {
  return TIMELINE.find(ev => currentBeat >= ev.startBeat && currentBeat < ev.endBeat) || null;
}
function getNextEvent(cur) {
  if (!cur) return TIMELINE[0];
  return TIMELINE[cur.idx + 1] || null;
}

function updateStats() {
  const acc = totalTargets > 0 ? Math.round((hits / totalTargets) * 100) : null;
  document.getElementById('scoreNow').textContent = acc !== null ? `정확도 ${acc}%` : '정확도 —';
}

function updateHUD() {
  const cur = getCurrentEvent();
  const next = getNextEvent(cur);
  if (cur) {
    document.getElementById('chordNow').textContent = cur.chord;
    document.getElementById('tipNow').textContent = cur.tip ? `💡 ${cur.tip}` : `${cur.sec} 구간`;
    document.getElementById('lyricNow').textContent = cur.lyric;
    document.getElementById('lyricNext').textContent = next ? `다음: ${next.chord} · ${next.lyric}` : '곡 마지막입니다!';
    document.getElementById('measureNow').textContent = `${cur.m} / 63 마디`;
    activeSection = cur.sec;
    document.querySelectorAll('.sec-pill').forEach(p => p.classList.toggle('on', p.textContent === activeSection));
  } else {
    document.getElementById('chordNow').textContent = '준비 — A♭M7';
    document.getElementById('measureNow').textContent = '1 / 63 마디';
  }
  const curSec = Math.floor((currentBeat * SEC_PER_BEAT) / speed);
  const totSec = Math.floor((TOTAL_BEATS * SEC_PER_BEAT) / speed);
  const fmt = s => `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
  document.getElementById('timeText').textContent = `${fmt(curSec)} / ${fmt(totSec)}`;
  document.getElementById('seekBar').value = Math.round((currentBeat / TOTAL_BEATS) * 1000);
  document.getElementById('bpmText').textContent = `${Math.round(BASE_BPM * speed)} BPM (${speed}x)`;

  // Highlight active target keys on piano
  Object.values(keyElements).forEach(el => {
    el.classList.remove('target-lh', 'target-rh');
  });
  if (cur) {
    cur.lh.forEach(m => { if (keyElements[m]) keyElements[m].classList.add('target-lh'); });
    cur.rh.forEach(m => { if (keyElements[m]) keyElements[m].classList.add('target-rh'); });
  }
}

// Canvas Rendering
const stageWrap = document.getElementById('stageWrap');
const canvas = document.getElementById('fallCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = stageWrap.clientWidth * dpr;
  canvas.height = stageWrap.clientHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function drawStage() {
  const W = stageWrap.clientWidth;
  const H = stageWrap.clientHeight;
  ctx.clearRect(0, 0, W, H);

  const scrollX = pianoWrap.scrollLeft;
  const beatsVisible = 6.5; // lookahead beats
  const pxPerBeat = H / beatsVisible;

  // Vertical key guide lines
  Object.entries(keyLayout).forEach(([midi, k]) => {
    const x = k.x - scrollX;
    if (x + k.w < 0 || x > W) return;
    if (!k.black) {
      ctx.strokeStyle = Number(midi) % 12 === 0 ? 'rgba(148,163,184,0.18)' : 'rgba(148,163,184,0.06)';
      ctx.beginPath();
      ctx.moveTo(x, 0); ctx.lineTo(x, H);
      ctx.stroke();
    }
  });

  // Beat horizontal grid lines
  const startB = Math.floor(currentBeat);
  const endB = Math.ceil(currentBeat + beatsVisible);
  for (let b = startB; b <= endB; b++) {
    const y = H - (b - currentBeat) * pxPerBeat;
    ctx.strokeStyle = b % 4 === 0 ? 'rgba(255,255,255,0.12)' : 'rgba(255,255,255,0.04)';
    ctx.beginPath();
    ctx.moveTo(0, y); ctx.lineTo(W, y);
    ctx.stroke();
  }

  // Hit line at bottom
  ctx.strokeStyle = 'rgba(56, 189, 248, 0.5)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, H - 2); ctx.lineTo(W, H - 2); ctx.stroke();
  ctx.lineWidth = 1;

  // Draw falling notes
  TIMELINE.forEach(ev => {
    if (ev.endBeat < currentBeat - 0.5 || ev.startBeat > currentBeat + beatsVisible) return;
    const yBottom = H - (ev.startBeat - currentBeat) * pxPerBeat;
    const yTop = H - (ev.endBeat - currentBeat) * pxPerBeat;
    const h = Math.max(10, yBottom - yTop - 3);

    const drawNoteGroup = (notes, fill, glow) => {
      notes.forEach(m => {
        const k = keyLayout[m];
        if (!k) return;
        const x = k.x - scrollX + 1;
        const w = Math.max(8, k.w - 2);
        if (x + w < 0 || x > W) return;

        ctx.save();
        ctx.fillStyle = fill;
        ctx.shadowColor = glow;
        ctx.shadowBlur = (currentBeat >= ev.startBeat && currentBeat < ev.endBeat) ? 12 : 4;
        roundRect(ctx, x, yTop + 2, w, h, 5);
        ctx.fill();

        if (h > 16 && w >= 16) {
          ctx.shadowBlur = 0;
          ctx.fillStyle = '#06121e';
          ctx.font = 'bold 10px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(midiLabel(m, showKorean), x + w / 2, yTop + h - 4);
        }
        ctx.restore();
      });
    };

    drawNoteGroup(ev.lh, '#38bdf8', 'rgba(56,189,248,0.6)');
    drawNoteGroup(ev.rh, '#34d399', 'rgba(52,211,153,0.6)');
  });

  if (showHands) {
    drawHandsOverlay(W, H, scrollX);
  }

  if (isScrubbing) {
    const cur = getCurrentEvent();
    const label = cur ? `◀  ${cur.m}마디 (${cur.sec}) · ${cur.chord}  ▶` : '◀  타임라인 이동 중  ▶';
    ctx.save();
    ctx.font = 'bold 13px sans-serif';
    const tw = Math.min(W - 32, ctx.measureText(label).width + 28);
    const bx = (W - tw) / 2;
    const by = 18;
    ctx.fillStyle = 'rgba(15, 23, 42, 0.88)';
    ctx.strokeStyle = 'rgba(56, 189, 248, 0.7)';
    ctx.lineWidth = 1.5;
    roundRect(ctx, bx, by, tw, 32, 16);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#e0f2fe';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, W / 2, by + 16);
    ctx.restore();
  }
}

function assignFingers(notes, hand) {
  const s = [...notes].sort((a, b) => a - b);
  const map = {};
  if (s.length === 0) return map;
  if (hand === 'lh') {
    if (s.length === 1) map[5] = s[0];
    else if (s.length === 2) { map[5] = s[0]; map[s[1] - s[0] >= 7 ? 1 : 2] = s[1]; }
    else if (s.length === 3) { map[5] = s[0]; map[3] = s[1]; map[1] = s[2]; }
    else { map[5] = s[0]; map[3] = s[1]; map[2] = s[2]; map[1] = s[3]; }
  } else {
    if (s.length === 1) map[3] = s[0];
    else if (s.length === 2) { map[1] = s[0]; map[s[1] - s[0] >= 7 ? 5 : (s[1] - s[0] >= 4 ? 3 : 2)] = s[1]; }
    else if (s.length === 3) { map[1] = s[0]; map[s[2] - s[0] >= 9 ? 2 : 3] = s[1]; map[5] = s[2]; }
    else { map[1] = s[0]; map[2] = s[1]; map[3] = s[2]; map[5] = s[3]; }
  }
  return map;
}

function drawSingleHand(H, scrollX, notes, hand) {
  if (!notes || notes.length === 0) return;
  const fMap = assignFingers(notes, hand);
  // Finger order left-to-right on keyboard:
  // LH: 5, 4, 3, 2, 1  |  RH: 1, 2, 3, 4, 5
  const order = hand === 'lh' ? [5, 4, 3, 2, 1] : [1, 2, 3, 4, 5];
  const color = hand === 'lh' ? '#38bdf8' : '#34d399';
  const fillBg = hand === 'lh' ? 'rgba(56, 189, 248, 0.24)' : 'rgba(52, 211, 153, 0.24)';
  const strokeCol = hand === 'lh' ? 'rgba(56, 189, 248, 0.85)' : 'rgba(52, 211, 153, 0.85)';

  // Find pressed x positions
  const pressedX = {};
  let sumX = 0, cnt = 0;
  order.forEach(f => {
    const m = fMap[f];
    if (m !== undefined && keyLayout[m]) {
      const x = keyLayout[m].x - scrollX + keyLayout[m].w / 2;
      pressedX[f] = x;
      sumX += x; cnt++;
    }
  });
  if (cnt === 0) return;

  // Estimate x for unpressed fingers smoothly
  const centerX = sumX / cnt;
  const fingerTip = {};
  const baseSpread = 16;
  const avgIdx = order.reduce((acc, f, idx) => pressedX[f] !== undefined ? acc + idx : acc, 0) / cnt;
  order.forEach((f, idx) => {
    const isPressed = pressedX[f] !== undefined;
    const x = isPressed ? pressedX[f] : centerX + (idx - avgIdx) * baseSpread;
    // Thumb slightly higher when resting
    const restY = f === 1 ? H - 36 : H - 28;
    const y = isPressed ? H - 12 : restY;
    fingerTip[f] = { x, y, isPressed };
  });

  const xs = order.map(f => fingerTip[f].x);
  const palmCenterX = (Math.min(...xs) + Math.max(...xs)) / 2;
  const palmW = Math.max(46, Math.max(...xs) - Math.min(...xs) + 14);
  const palmY = H - 72;
  const palmH = 30;

  ctx.save();
  // Palm silhouette
  ctx.fillStyle = fillBg;
  ctx.strokeStyle = strokeCol;
  ctx.lineWidth = 1.6;
  roundRect(ctx, palmCenterX - palmW / 2, palmY, palmW, palmH, 12);
  ctx.fill();
  ctx.stroke();

  // Hand label inside palm
  ctx.fillStyle = '#f8fafc';
  ctx.font = 'bold 10px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(hand === 'lh' ? '왼손' : '오른손', palmCenterX, palmY + palmH / 2);

  // Fingers from palm knuckles to tips
  order.forEach((f, idx) => {
    const tip = fingerTip[f];
    const knuckleX = palmCenterX - palmW * 0.36 + (idx / 4) * (palmW * 0.72);
    const knuckleY = palmY + palmH - 3;

    ctx.beginPath();
    ctx.moveTo(knuckleX, knuckleY);
    ctx.lineTo(tip.x, tip.y);
    ctx.strokeStyle = tip.isPressed ? color : 'rgba(226, 232, 240, 0.35)';
    ctx.lineWidth = tip.isPressed ? 7 : 5;
    ctx.lineCap = 'round';
    ctx.stroke();

    // Fingertip circle with finger number
    const r = tip.isPressed ? 9 : 6;
    ctx.beginPath();
    ctx.arc(tip.x, tip.y, r, 0, Math.PI * 2);
    ctx.fillStyle = tip.isPressed ? color : 'rgba(30, 41, 59, 0.85)';
    ctx.fill();
    ctx.strokeStyle = tip.isPressed ? '#ffffff' : 'rgba(148, 163, 184, 0.45)';
    ctx.lineWidth = tip.isPressed ? 1.8 : 1;
    ctx.stroke();

    ctx.fillStyle = tip.isPressed ? '#06121e' : '#94a3b8';
    ctx.font = tip.isPressed ? 'bold 10px sans-serif' : '9px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(String(f), tip.x, tip.y + 0.5);
  });
  ctx.restore();
}

function drawHandsOverlay(W, H, scrollX) {
  const cur = getCurrentEvent() || TIMELINE[0];
  if (!cur) return;
  drawSingleHand(H, scrollX, cur.lh, 'lh');
  drawSingleHand(H, scrollX, cur.rh, 'rh');
}

function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.lineTo(x + w - r, y);
  c.quadraticCurveTo(x + w, y, x + w, y + r);
  c.lineTo(x + w, y + h - r);
  c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  c.lineTo(x + r, y + h);
  c.quadraticCurveTo(x, y + h, x, y + h - r);
  c.lineTo(x, y + r);
  c.quadraticCurveTo(x, y, x + r, y);
  c.closePath();
}

// Main Animation Loop
function loop(ts) {
  if (lastFrameTime === null) lastFrameTime = ts;
  const dt = (ts - lastFrameTime) / 1000;
  lastFrameTime = ts;

  if (isPlaying) {
    const prevBeat = currentBeat;
    currentBeat += (dt / SEC_PER_BEAT) * speed;

    // Loop section check
    if (loopSection && SECTION_RANGES[activeSection]) {
      const sr = SECTION_RANGES[activeSection];
      if (currentBeat >= sr.endBeat) {
        currentBeat = sr.startBeat;
        playedEvents.clear();
      }
    }

    if (currentBeat >= TOTAL_BEATS) {
      currentBeat = 0;
      isPlaying = false;
      playedEvents.clear();
      updatePlayBtn();
    }

    // Metronome tick
    const tick = Math.floor(currentBeat);
    if (tick !== lastBeatTick && tick >= 0) {
      lastBeatTick = tick;
      playClick(tick % 4 === 0);
    }

    // Trigger event sound & wait-mode check
    const cur = getCurrentEvent();
    if (cur) {
      if (waitMode && waitedIdx !== cur.idx && currentBeat >= cur.startBeat && prevBeat < cur.startBeat + 0.25) {
        waitedIdx = cur.idx;
        isPlaying = false;
        updatePlayBtn();
        document.getElementById('waitBanner').style.display = 'block';
      } else if (!playedEvents.has(cur.idx)) {
        playedEvents.add(cur.idx);
        const dur = Math.min(2.2, (cur.b * SEC_PER_BEAT) / speed);
        cur.lh.forEach(m => playPianoNote(m, dur, 0.16));
        cur.rh.forEach(m => playPianoNote(m, dur, 0.12));
      }
    }
    updateHUD();
  }

  drawStage();
  requestAnimationFrame(loop);
}

// UI Bindings
function updatePlayBtn() {
  const b = document.getElementById('btnPlay');
  b.textContent = isPlaying ? '⏸ 일시정지' : '▶ 재생';
}
document.getElementById('btnPlay').onclick = () => {
  ensureAudio();
  isPlaying = !isPlaying;
  if (isPlaying) document.getElementById('waitBanner').style.display = 'none';
  updatePlayBtn();
};
document.getElementById('btnReset').onclick = () => {
  currentBeat = 0; isPlaying = false; playedEvents.clear(); waitedIdx = -1;
  document.getElementById('waitBanner').style.display = 'none';
  updatePlayBtn(); updateHUD();
};
document.getElementById('btnWait').onclick = (e) => {
  waitMode = !waitMode;
  waitedIdx = -1;
  e.target.textContent = `⏸ 기다림 모드: ${waitMode ? 'ON' : 'OFF'}`;
  e.target.classList.toggle('wait-on', waitMode);
  if (!waitMode) document.getElementById('waitBanner').style.display = 'none';
};
document.getElementById('btnLoop').onclick = (e) => {
  loopSection = !loopSection;
  e.target.textContent = `🔁 구간반복: ${loopSection ? 'ON' : 'OFF'}`;
  e.target.classList.toggle('active', loopSection);
};
document.querySelectorAll('.speed-btn').forEach(btn => {
  btn.onclick = () => {
    speed = parseFloat(btn.dataset.spd);
    document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    updateHUD();
  };
});
document.getElementById('btnZoom').onclick = (e) => {
  zoomRange = !zoomRange;
  e.target.textContent = zoomRange ? '🎹 전체 88건반' : '🔍 연주구간 확대';
  e.target.classList.toggle('active', zoomRange);
  buildKeyboard();
  updateHUD();
};
document.getElementById('btnLabels').onclick = (e) => {
  showKorean = !showKorean;
  e.target.textContent = showKorean ? '한글 계이름' : '영문 음이름';
  buildKeyboard();
  updateHUD();
};
document.getElementById('btnHands').onclick = (e) => {
  showHands = !showHands;
  e.target.classList.toggle('active', showHands);
};
document.getElementById('btnMetro').onclick = (e) => {
  metroOn = !metroOn;
  e.target.classList.toggle('active', metroOn);
};
document.getElementById('btnSound').onclick = (e) => {
  soundOn = !soundOn;
  e.target.classList.toggle('active', soundOn);
  e.target.textContent = soundOn ? '🔊 피아노음' : '🔇 음소거';
};
document.getElementById('seekBar').oninput = (e) => {
  currentBeat = (parseFloat(e.target.value) / 1000) * TOTAL_BEATS;
  playedEvents.clear();
  waitedIdx = -1;
  updateHUD();
};

// Stage Horizontal Slide-to-Scrub Timeline (touch + mouse + trackpad)
let isScrubbing = false;
let scrubStartX = 0;
let scrubStartBeat = 0;
let scrubWasPlaying = false;
let scrubLabelTimer = null;

canvas.style.touchAction = 'none';
canvas.style.cursor = 'grab';

canvas.addEventListener('pointerdown', (e) => {
  if (e.button !== 0 && e.pointerType === 'mouse') return;
  isScrubbing = true;
  scrubStartX = e.clientX;
  scrubStartBeat = currentBeat;
  scrubWasPlaying = isPlaying;
  if (isPlaying) {
    isPlaying = false;
    updatePlayBtn();
  }
  canvas.style.cursor = 'grabbing';
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
});

canvas.addEventListener('pointermove', (e) => {
  if (!isScrubbing) return;
  const dx = e.clientX - scrubStartX;
  const pxPerBeat = Math.max(28, Math.min(56, stageWrap.clientWidth / 8));
  const nextBeat = Math.max(0, Math.min(TOTAL_BEATS - 0.01, scrubStartBeat + dx / pxPerBeat));
  currentBeat = nextBeat;
  playedEvents.clear();
  waitedIdx = -1;
  document.getElementById('waitBanner').style.display = 'none';
  updateHUD();
});

function endScrub(e) {
  if (!isScrubbing) return;
  isScrubbing = false;
  canvas.style.cursor = 'grab';
  try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
  if (scrubWasPlaying) {
    isPlaying = true;
    updatePlayBtn();
  }
}
canvas.addEventListener('pointerup', endScrub);
canvas.addEventListener('pointercancel', endScrub);

canvas.addEventListener('wheel', (e) => {
  if (Math.abs(e.deltaX) > Math.abs(e.deltaY) && Math.abs(e.deltaX) > 1) {
    e.preventDefault();
    currentBeat = Math.max(0, Math.min(TOTAL_BEATS - 0.01, currentBeat - e.deltaX / 45));
    playedEvents.clear();
    waitedIdx = -1;
    document.getElementById('waitBanner').style.display = 'none';
    updateHUD();
  }
}, { passive: false });

// Spacebar play/pause
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    e.preventDefault();
    document.getElementById('btnPlay').click();
  }
});

window.addEventListener('resize', () => {
  resizeCanvas();
  buildKeyboard();
  updateHUD();
});

resizeCanvas();
buildKeyboard();
updateHUD();
requestAnimationFrame(loop);
</script>
